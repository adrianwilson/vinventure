name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  dependabot:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '8.15.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Check if PR is safe to auto-merge
        id: auto-merge-check
        run: |
          # Auto-merge patch updates for known safe packages
          if [[ "${{ steps.metadata.outputs.update-type }}" == "version-update:semver-patch" ]]; then
            echo "Auto-merge allowed for patch updates"
            echo "auto_merge=true" >> $GITHUB_OUTPUT
          # Auto-merge minor updates for dev dependencies
          elif [[ "${{ steps.metadata.outputs.dependency-type }}" == "indirect" || "${{ steps.metadata.outputs.dependency-type }}" == "development" ]] && [[ "${{ steps.metadata.outputs.update-type }}" == "version-update:semver-minor" ]]; then
            echo "Auto-merge allowed for minor dev dependency updates"
            echo "auto_merge=true" >> $GITHUB_OUTPUT
          # Auto-merge security updates (all types)
          elif [[ "${{ contains(steps.metadata.outputs.alert-state, 'OPEN') }}" == "true" ]]; then
            echo "Auto-merge allowed for security updates"
            echo "auto_merge=true" >> $GITHUB_OUTPUT
          else
            echo "Auto-merge not allowed for this update type"
            echo "auto_merge=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for CI checks to complete
        if: steps.auto-merge-check.outputs.auto_merge == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'Frontend CI'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,skipped

      - name: Wait for Backend CI checks
        if: steps.auto-merge-check.outputs.auto_merge == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'Backend CI'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,skipped

      - name: Wait for Security Scan
        if: steps.auto-merge-check.outputs.auto_merge == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'Security Scan'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,skipped

      - name: Enable auto-merge for Dependabot PRs
        if: steps.auto-merge-check.outputs.auto_merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: steps.auto-merge-check.outputs.auto_merge == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Dependabot Auto-Merge** 
              
              This PR has been automatically scheduled for merge after all checks pass.
              
              - **Update Type**: ${{ steps.metadata.outputs.update-type }}
              - **Dependency Type**: ${{ steps.metadata.outputs.dependency-type }}
              - **Package**: ${{ steps.metadata.outputs.dependency-names }}
              
              The PR will be merged automatically once all CI checks are successful.`
            })

      - name: Add labels to PR
        if: steps.auto-merge-check.outputs.auto_merge == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['dependencies', 'auto-merge']
            })

      - name: Comment on manual review required
        if: steps.auto-merge-check.outputs.auto_merge == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 **Manual Review Required**
              
              This Dependabot PR requires manual review before merging.
              
              - **Update Type**: ${{ steps.metadata.outputs.update-type }}
              - **Dependency Type**: ${{ steps.metadata.outputs.dependency-type }}
              - **Package**: ${{ steps.metadata.outputs.dependency-names }}
              
              Please review the changes and merge manually if appropriate.`
            })

      - name: Add manual review labels
        if: steps.auto-merge-check.outputs.auto_merge == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['dependencies', 'needs-review']
            })