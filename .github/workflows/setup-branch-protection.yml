name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to setup'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  setup-protection:
    name: Setup Branch Protection Rules
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Branch Protection for Main
        if: github.event.inputs.environment == 'production'
        run: |
          # This would typically be done via GitHub CLI or API
          echo "Setting up branch protection for main branch..."
          echo "Branch protection rules:"
          echo "- Require status checks to pass before merging"
          echo "- Require branches to be up to date before merging"
          echo "- Require pull request reviews before merging"
          echo "- Require linear history"
          echo "- Restrict pushes that create files larger than 100MB"
          echo "- Allow force pushes only by administrators"
          echo "- Allow deletions only by administrators"

          # Note: Actual implementation would use GitHub CLI:
          # gh api repos/:owner/:repo/branches/main/protection \
          #   --method PUT \
          #   --field required_status_checks='{"strict":true,"contexts":["CI/CD Pipeline"]}' \
          #   --field enforce_admins=true \
          #   --field required_pull_request_reviews='{"required_approving_review_count":1,"dismiss_stale_reviews":true}' \
          #   --field restrictions='{"users":[],"teams":[]}'

      - name: Setup Branch Protection for Develop
        if: github.event.inputs.environment == 'staging'
        run: |
          echo "Setting up branch protection for develop branch..."
          echo "Note: We're using GitHub Flow, so develop branch is not needed"
          echo "Feature branches are protected via PR requirements"

      - name: Create Branch Protection Summary
        run: |
          cat << EOF > branch-protection-summary.md
          # Branch Protection Setup Summary

          ## Main Branch Protection Rules

          ### Required Status Checks
          - ✅ CI/CD Pipeline must pass
          - ✅ Security scans must pass
          - ✅ All tests must pass
          - ✅ Code coverage requirements met

          ### Required Reviews
          - ✅ At least 1 approval required
          - ✅ Dismiss stale reviews when new commits are pushed
          - ✅ Require review from code owners

          ### Additional Rules
          - ✅ Require branches to be up to date before merging
          - ✅ Require linear history (no merge commits)
          - ✅ Restrict pushes to main (only via PR)
          - ✅ Allow force pushes only by administrators
          - ✅ Allow deletions only by administrators

          ## Feature Branch Workflow

          ### Automatic Checks
          - ✅ All CI tests run on every push
          - ✅ Security scans on every PR
          - ✅ Preview deployments for testing

          ### Manual Requirements
          - ✅ Code review required before merge
          - ✅ All CI checks must pass
          - ✅ No merge conflicts

          ## Next Steps

          1. Configure branch protection rules in GitHub repository settings
          2. Set up code owners file
          3. Configure required status checks
          4. Test the workflow with a sample PR

          EOF

          echo "Branch protection summary created"

      - name: Upload Summary
        uses: actions/upload-artifact@v7
        with:
          name: branch-protection-summary
          path: branch-protection-summary.md
