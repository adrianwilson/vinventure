name: Security Scanning

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: '22'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          pnpm audit --audit-level moderate || true

      - name: Run pnpm audit (Lambda)
        working-directory: lambda
        run: |
          pnpm audit --audit-level moderate || true

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            -r
            --skip-git
            --format=sarif
            --output=osv-results.sarif
            ./
        continue-on-error: true

      - name: Upload OSV scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('osv-results.sarif') != ''
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  code-security-scan:
    name: Static Code Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  infrastructure-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CDK/CloudFormation Security Scan with Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: cloudformation,sca_package
          output_format: sarif
          output_file_path: reports/results.sarif
        continue-on-error: true

      - name: Upload Checkov scan results
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('reports/results.sarif') != ''
        with:
          sarif_file: reports/results.sarif
          category: checkov

  security-report:
    name: Security Report Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security-scan, secrets-scan, infrastructure-scan]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Generate Security Report
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              dependency: '${{ needs.dependency-scan.result }}',
              code: '${{ needs.code-security-scan.result }}',
              secrets: '${{ needs.secrets-scan.result }}',
              infrastructure: '${{ needs.infrastructure-scan.result }}'
            };

            const getStatusEmoji = (status) => {
              switch(status) {
                case 'success': return 'PASS';
                case 'failure': return 'FAIL';
                case 'skipped': return 'SKIP';
                default: return '??';
              }
            };

            let report = '# Security Scan Report\n\n';
            report += `**Date**: ${new Date().toISOString()}\n\n`;
            report += '| Scan | Status |\n|------|--------|\n';
            for (const [scan, result] of Object.entries(results)) {
              report += `| ${scan} | ${getStatusEmoji(result)} |\n`;
            }

            const hasFailures = Object.values(results).some(r => r === 'failure');
            if (hasFailures) {
              report += '\nAction required: review failed scans in the Actions tab.\n';
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Security Scan Failures - ${new Date().toISOString().split('T')[0]}`,
                body: report,
                labels: ['security', 'automated']
              });
            }

            console.log(report);
