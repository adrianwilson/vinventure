name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_tests:
        description: 'Run all tests'
        required: false
        default: true
        type: boolean
      deploy:
        description: 'Deploy after build'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '18'

jobs:
  # Detect changes to determine what needs to be built/tested
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'libs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'nx.json'
              - 'tsconfig.base.json'
            backend:
              - 'lambda/**'
              - 'libs/database/**'
              - 'libs/shared/**'
            infrastructure:
              - 'apps/infrastructure/**'
              - 'lambda/**'

  # Setup job for caching and dependencies
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            lambda/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

  # Frontend CI
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        run: pnpm install

      - name: TypeScript Check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test
        env:
          CI: true

      - name: Build Frontend
        run: pnpm run build:static
        env:
          NODE_ENV: production

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/web/out
          retention-days: 7

  # Backend CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vinventure_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            lambda/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        run: pnpm install

      - name: Install Lambda Dependencies
        working-directory: lambda
        run: pnpm install

      - name: Generate Prisma Client
        working-directory: lambda
        run: npx prisma generate

      - name: Run Database Migrations
        working-directory: lambda
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vinventure_test

      - name: TypeScript Check (Backend)
        working-directory: lambda
        run: npx tsc --noEmit

      - name: Build Backend
        working-directory: lambda
        run: pnpm run build

      - name: Run Backend Tests
        working-directory: lambda
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vinventure_test
          JWT_SECRET: test-secret
          STRIPE_SECRET_KEY: test-stripe-key-not-real
          NODE_ENV: test

      - name: Upload Backend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: lambda/dist
          retention-days: 7

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Run Security Audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run pnpm audit
        working-directory: lambda
        run: pnpm audit --audit-level moderate
        continue-on-error: true

  # Deploy to Staging (feature branches via PR previews)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [changes, frontend-ci, backend-ci]
    if: |
      (github.event_name == 'pull_request' && (needs.frontend-ci.result == 'success' || needs.backend-ci.result == 'success')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' && github.event.inputs.deploy == 'true')
    environment:
      name: staging
      url: https://staging.vinventure.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download Frontend Build
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/web/out

      - name: Deploy Frontend to S3
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          aws s3 sync apps/web/out/ s3://${{ vars.STAGING_S3_BUCKET }} --delete --cache-control "public,max-age=31536000,immutable" --exclude "*.html" --exclude "*.json"
          aws s3 sync apps/web/out/ s3://${{ vars.STAGING_S3_BUCKET }} --delete --cache-control "public,max-age=0,must-revalidate" --include "*.html" --include "*.json"

      - name: Invalidate CloudFront Cache
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Download Backend Build
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: lambda/dist

      - name: Deploy Backend to Lambda
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: lambda
        run: |
          zip -r function.zip dist/ node_modules/ package.json prisma/
          aws lambda update-function-code --function-name ${{ vars.STAGING_LAMBDA_FUNCTION_NAME }} --zip-file fileb://function.zip

  # Deploy to Production (main branch)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [changes, frontend-ci, backend-ci, security-scan]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push' && (needs.frontend-ci.result == 'success' || needs.backend-ci.result == 'success') && needs.security-scan.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.event.inputs.deploy == 'true')
    environment:
      name: production
      url: https://vinventure.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download Frontend Build
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/web/out

      - name: Deploy Frontend to S3
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          aws s3 sync apps/web/out/ s3://${{ vars.PRODUCTION_S3_BUCKET }} --delete --cache-control "public,max-age=31536000,immutable" --exclude "*.html" --exclude "*.json"
          aws s3 sync apps/web/out/ s3://${{ vars.PRODUCTION_S3_BUCKET }} --delete --cache-control "public,max-age=0,must-revalidate" --include "*.html" --include "*.json"

      - name: Invalidate CloudFront Cache
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Download Backend Build
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: lambda/dist

      - name: Deploy Backend to Lambda
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: lambda
        run: |
          zip -r function.zip dist/ node_modules/ package.json prisma/
          aws lambda update-function-code --function-name ${{ vars.PRODUCTION_LAMBDA_FUNCTION_NAME }} --zip-file fileb://function.zip

      - name: Run Database Migrations (Production)
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: lambda
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  # Notification
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result != 'skipped' || needs.deploy-production.result != 'skipped')
    steps:
      - name: Notify Success
        if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success'
        run: echo "Deployment successful!"

      - name: Notify Failure
        if: needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure'
        run: echo "Deployment failed!" && exit 1
