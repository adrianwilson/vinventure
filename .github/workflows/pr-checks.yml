name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8.15.0'

jobs:
  # Skip checks if PR is in draft
  pr-validation:
    name: PR Validation Setup
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if PR should run CI
        id: check
        run: |
          if [[ "${{ github.event.pull_request.draft }}" == "true" && "${{ github.event.action }}" != "ready_for_review" ]]; then
            echo "PR is draft, skipping CI checks"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "PR is ready for review, running CI checks"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  # Detect changes for targeted testing
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: pr-validation
    if: needs.pr-validation.outputs.should_run == 'true'
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'libs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'nx.json'
              - 'tsconfig.base.json'
            backend:
              - 'lambda/**'
              - 'libs/database/**'
              - 'libs/shared/**'
            infrastructure:
              - 'apps/infrastructure/**'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  # PR title and description validation
  pr-format:
    name: Validate PR Format
    runs-on: ubuntu-latest
    needs: pr-validation
    if: needs.pr-validation.outputs.should_run == 'true'
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          disallowScopes: |
            release
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

      - name: Check PR Description Length
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            if (!pr.body || pr.body.trim().length < 20) {
              core.setFailed('PR description is too short. Please provide a meaningful description of at least 20 characters.');
            } else {
              console.log('PR description is adequate.');
            }

  # Code quality checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: [pr-validation, changes]
    if: needs.pr-validation.outputs.should_run == 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier Check
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}"
        continue-on-error: true

      - name: Check for TODO/FIXME comments
        run: |
          if grep -r "TODO\|FIXME" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" apps/ lambda/ libs/ || true; then
            echo "⚠️ Found TODO/FIXME comments in the code. Please address them before merging."
          else
            echo "✅ No TODO/FIXME comments found."
          fi

      - name: Check for console.log statements
        run: |
          if grep -r "console\." --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" apps/web/ || true; then
            echo "⚠️ Found console statements in frontend code. Consider using a proper logging solution."
          else
            echo "✅ No console statements found in frontend code."
          fi

  # Security checks
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: [pr-validation, changes]
    if: needs.pr-validation.outputs.should_run == 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          echo "Running security audit for root dependencies..."
          pnpm audit --audit-level moderate || true
          
          echo "Running security audit for lambda dependencies..."
          cd lambda && npm audit --audit-level moderate || true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # Bundle size check (frontend)
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [pr-validation, changes]
    if: needs.pr-validation.outputs.should_run == 'true' && needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Analyze bundle size
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Check if .next/static exists and get bundle info
            const nextDir = path.join(process.cwd(), 'apps/web/.next/static');
            if (fs.existsSync(nextDir)) {
              const stats = fs.readdirSync(path.join(nextDir, 'chunks/pages'), { withFileTypes: true })
                .filter(dirent => dirent.isFile() && dirent.name.endsWith('.js'))
                .map(dirent => {
                  const filePath = path.join(nextDir, 'chunks/pages', dirent.name);
                  const size = fs.statSync(filePath).size;
                  return { name: dirent.name, size: Math.round(size / 1024) };
                });
              
              const totalSize = stats.reduce((sum, file) => sum + file.size, 0);
              
              console.log('📦 Bundle Analysis:');
              console.log(`Total JavaScript size: ${totalSize}KB`);
              
              if (totalSize > 1000) {  // 1MB threshold
                core.setFailed(`Bundle size is too large: ${totalSize}KB. Consider code splitting or removing unused dependencies.`);
              }
            }

  # Performance checks
  performance:
    name: Performance Checks
    runs-on: ubuntu-latest
    needs: [pr-validation, changes]
    if: needs.pr-validation.outputs.should_run == 'true' && needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for large dependencies
        run: |
          echo "📊 Checking for large dependencies..."
          npx bundlephobia-cli --cache-directory=.bundlephobia-cache package.json || true

  # Comment on PR with check results
  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [changes, code-quality, security-checks, bundle-size, performance]
    if: always() && needs.changes.result != 'skipped'
    steps:
      - name: Create PR Summary Comment
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              codeQuality: '${{ needs.code-quality.result }}',
              security: '${{ needs.security-checks.result }}',
              bundleSize: '${{ needs.bundle-size.result }}',
              performance: '${{ needs.performance.result }}'
            };
            
            let comment = '## 🔍 PR Check Results\n\n';
            
            const getStatusEmoji = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'skipped': return '⏭️';
                default: return '⚪';
              }
            };
            
            comment += `| Check | Status | Details |\n`;
            comment += `|-------|--------|--------|\n`;
            comment += `| Code Quality | ${getStatusEmoji(results.codeQuality)} | ${results.codeQuality} |\n`;
            comment += `| Security | ${getStatusEmoji(results.security)} | ${results.security} |\n`;
            comment += `| Bundle Size | ${getStatusEmoji(results.bundleSize)} | ${results.bundleSize} |\n`;
            comment += `| Performance | ${getStatusEmoji(results.performance)} | ${results.performance} |\n`;
            
            comment += '\n### Changes Detected\n';
            comment += `- Frontend: ${{ needs.changes.outputs.frontend == 'true' ? '✅' : '❌' }}\n`;
            comment += `- Backend: ${{ needs.changes.outputs.backend == 'true' ? '✅' : '❌' }}\n`;
            comment += `- Infrastructure: ${{ needs.changes.outputs.infrastructure == 'true' ? '✅' : '❌' }}\n`;
            comment += `- Documentation: ${{ needs.changes.outputs.docs == 'true' ? '✅' : '❌' }}\n`;
            
            comment += '\n---\n*This comment is automatically updated by the PR validation workflow.*';
            
            // Find existing comment and update or create new one
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('🔍 PR Check Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }