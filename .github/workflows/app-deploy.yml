name: Application Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'
  AWS_REGION: 'ca-central-1'

jobs:
  # Build and test the application
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      infrastructure-changed: ${{ steps.changes.outputs.infrastructure }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          frontend:
            - 'apps/web/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
          backend:
            - 'lambda/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
          infrastructure:
            - 'apps/infrastructure/**'
            - '.github/workflows/app-deploy.yml'
            - '.github/workflows/cdk-deploy.yml'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Frontend build and test
    - name: Build frontend
      if: steps.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
      run: |
        cd apps/web
        pnpm run build
      env:
        NEXT_PUBLIC_API_BASE_URL: https://staging-api.vinventure.com
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
        NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID }}
        NEXT_PUBLIC_AWS_REGION: ${{ env.AWS_REGION }}

    - name: Test frontend
      if: steps.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
      run: |
        cd apps/web
        # Add frontend tests when available
        # pnpm run test

    # Backend build and test
    - name: Setup test database
      if: steps.changes.outputs.backend == 'true' || github.event_name == 'pull_request'
      run: |
        docker run -d \
          --name postgres-test \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=vinventure_test \
          -p 5432:5432 \
          postgres:15

    - name: Build and test backend
      if: steps.changes.outputs.backend == 'true' || github.event_name == 'pull_request'
      run: |
        cd lambda
        pnpm run build
        # Add backend tests when available  
        # pnpm run test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vinventure_test

    - name: Upload frontend build
      if: steps.changes.outputs.frontend == 'true'
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build-${{ github.sha }}
        path: apps/web/out/
        retention-days: 7

    - name: Upload backend build
      if: steps.changes.outputs.backend == 'true'
      uses: actions/upload-artifact@v3
      with:
        name: backend-build-${{ github.sha }}
        path: lambda/dist/
        retention-days: 7

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to staging (develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Download artifacts if they were built
    - name: Download frontend build
      if: needs.build-and-test.outputs.frontend-changed == 'true'
      uses: actions/download-artifact@v3
      with:
        name: frontend-build-${{ github.sha }}
        path: apps/web/out/

    # Build frontend if not built in previous job
    - name: Build frontend (if not cached)
      if: needs.build-and-test.outputs.frontend-changed != 'true'
      run: |
        cd apps/web
        pnpm run build
      env:
        NEXT_PUBLIC_API_BASE_URL: https://staging-api.vinventure.com
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
        NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID }}
        NEXT_PUBLIC_AWS_REGION: ${{ env.AWS_REGION }}

    - name: CDK Bootstrap
      run: |
        cd apps/infrastructure
        npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}

    - name: Deploy to staging with CDK
      run: |
        cd apps/infrastructure
        npx cdk deploy VinventureStack-Staging \
          --context environment=staging \
          --require-approval never \
          --outputs-file cdk-outputs-staging.json
      env:
        STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
        STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}

    - name: Output staging deployment info
      run: |
        cd apps/infrastructure
        if [ -f cdk-outputs-staging.json ]; then
          echo "## 🚀 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          CLOUDFRONT_URL=$(jq -r '.["VinventureStack-Staging"].CloudFrontUrl // "Not available"' cdk-outputs-staging.json)
          API_URL=$(jq -r '.["VinventureStack-Staging"].ApiGatewayUrl // "Not available"' cdk-outputs-staging.json)
          
          echo "**Frontend:** $CLOUDFRONT_URL" >> $GITHUB_STEP_SUMMARY
          echo "**API:** $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: **staging**" >> $GITHUB_STEP_SUMMARY
        fi

  # Deploy to production (main branch)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Download artifacts if they were built
    - name: Download frontend build
      if: needs.build-and-test.outputs.frontend-changed == 'true'
      uses: actions/download-artifact@v3
      with:
        name: frontend-build-${{ github.sha }}
        path: apps/web/out/

    # Build frontend if not built in previous job
    - name: Build frontend (if not cached)
      if: needs.build-and-test.outputs.frontend-changed != 'true'
      run: |
        cd apps/web
        pnpm run build
      env:
        NEXT_PUBLIC_API_BASE_URL: https://api.vinventure.com
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
        NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID }}
        NEXT_PUBLIC_AWS_REGION: ${{ env.AWS_REGION }}

    - name: CDK Bootstrap
      run: |
        cd apps/infrastructure
        npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}

    - name: Deploy to production with CDK
      run: |
        cd apps/infrastructure
        npx cdk deploy VinventureStack-Production \
          --context environment=production \
          --require-approval never \
          --outputs-file cdk-outputs-production.json
      env:
        STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
        STRIPE_LIVE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY }}
        STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}

    - name: Run production health checks
      run: |
        cd apps/infrastructure
        if [ -f cdk-outputs-production.json ]; then
          API_URL=$(jq -r '.["VinventureStack-Production"].ApiGatewayUrl // empty' cdk-outputs-production.json)
          
          if [ ! -z "$API_URL" ]; then
            echo "Testing production API health..."
            sleep 30  # Wait for API to be ready
            
            # Retry health check
            for i in {1..5}; do
              if curl -f "${API_URL}api/health"; then
                echo "✅ Production API is healthy"
                break
              else
                echo "⏳ Waiting for API (attempt $i/5)..."
                sleep 15
              fi
            done
          fi
        fi

    - name: Output production deployment info
      run: |
        cd apps/infrastructure
        if [ -f cdk-outputs-production.json ]; then
          echo "## 🎉 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          CLOUDFRONT_URL=$(jq -r '.["VinventureStack-Production"].CloudFrontUrl // "Not available"' cdk-outputs-production.json)
          API_URL=$(jq -r '.["VinventureStack-Production"].ApiGatewayUrl // "Not available"' cdk-outputs-production.json)
          
          echo "**Frontend:** $CLOUDFRONT_URL" >> $GITHUB_STEP_SUMMARY
          echo "**API:** $API_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: **production**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Visit the application]($CLOUDFRONT_URL)" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload production outputs
      uses: actions/upload-artifact@v3
      with:
        name: production-deployment-info
        path: apps/infrastructure/cdk-outputs-production.json
        retention-days: 90