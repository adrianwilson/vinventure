name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      destroy:
        description: 'Destroy infrastructure (use with caution)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ca-central-1
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate]
    if: vars.AWS_ENABLED == 'true'
    defaults:
      run:
        working-directory: ./apps/infrastructure
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Frontend
        run: |
          cd ${{ github.workspace }}
          pnpm run build:static

      - name: CDK Bootstrap (if needed)
        run: |
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit --region ${{ env.AWS_REGION }} 2>/dev/null; then
            npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}
          fi

      - name: CDK Deploy Production
        run: |
          npx cdk deploy VinventureStack-Production \
            --context environment=production \
            --require-approval never \
            --outputs-file cdk-outputs-production.json
        env:
          STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          STRIPE_LIVE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}

      - name: Extract CDK Outputs
        run: |
          if [ -f cdk-outputs-production.json ]; then
            echo "## Production Deployment Outputs" >> $GITHUB_STEP_SUMMARY
            cat cdk-outputs-production.json >> $GITHUB_STEP_SUMMARY

            CLOUDFRONT_URL=$(jq -r '.["VinventureStack-Production"].CloudFrontUrl // empty' cdk-outputs-production.json)
            API_URL=$(jq -r '.["VinventureStack-Production"].ApiGatewayUrl // empty' cdk-outputs-production.json)

            [ -n "$CLOUDFRONT_URL" ] && echo "PRODUCTION_FRONTEND_URL=$CLOUDFRONT_URL" >> $GITHUB_ENV
            [ -n "$API_URL" ] && echo "PRODUCTION_API_URL=$API_URL" >> $GITHUB_ENV
          fi

      - name: Upload CDK Outputs
        uses: actions/upload-artifact@v7
        with:
          name: cdk-outputs-production
          path: ./apps/infrastructure/cdk-outputs-production.json
          retention-days: 90

      - name: Health Check
        run: |
          if [ -n "$PRODUCTION_API_URL" ]; then
            sleep 30
            for i in {1..5}; do
              curl -f "${PRODUCTION_API_URL}api/health" && echo "API healthy" && break
              echo "Waiting... (attempt $i/5)" && sleep 10
            done
          fi

  destroy-infrastructure:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
    defaults:
      run:
        working-directory: ./apps/infrastructure
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure frontend build directory exists
        run: mkdir -p ../../apps/web/out && touch ../../apps/web/out/index.html

      - name: CDK Destroy
        run: |
          npx cdk destroy VinventureStack-${{ github.event.inputs.environment }} \
            --context environment=${{ github.event.inputs.environment }} \
            --force
