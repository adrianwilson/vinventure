name: CDK Infrastructure Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/infrastructure/**'
      - '.github/workflows/cdk-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/infrastructure/**'
      - '.github/workflows/cdk-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      destroy:
        description: 'Destroy infrastructure (use with caution)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: ca-central-1
  NODE_VERSION: '18'

jobs:
  # CDK Diff and Validation
  cdk-diff:
    name: CDK Diff and Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./apps/infrastructure

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: CDK Bootstrap (if needed)
      run: |
        if ! aws cloudformation describe-stacks --stack-name CDKToolkit --region ${{ env.AWS_REGION }} 2>/dev/null; then
          npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}
        fi

    - name: CDK Synth
      run: npx cdk synth --all

    - name: CDK Diff Staging
      run: |
        echo "## 🔍 CDK Diff for Staging Environment" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
        npx cdk diff --context environment=staging >> $GITHUB_STEP_SUMMARY 2>&1 || true
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Security and Compliance Check
      run: |
        # Check for hard-coded secrets
        if grep -r "AKIA\|password\|secret" src/ --exclude-dir=node_modules; then
          echo "❌ Potential secrets found in code"
          exit 1
        fi
        
        # Check for overly permissive policies
        if grep -r "\*:\*" cdk.out/*.template.json; then
          echo "⚠️ Found potentially overly permissive IAM policies"
        fi
        
        echo "✅ Basic security checks passed"

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./apps/infrastructure
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: CDK Bootstrap
      run: |
        npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}

    - name: CDK Deploy Staging
      run: |
        npx cdk deploy VinventureStack-Staging \
          --context environment=staging \
          --require-approval never \
          --outputs-file cdk-outputs-staging.json
      env:
        STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
        STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}

    - name: Extract CDK Outputs
      run: |
        if [ -f cdk-outputs-staging.json ]; then
          echo "## 🚀 Staging Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat cdk-outputs-staging.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Extract important values for GitHub environment variables
          CLOUDFRONT_URL=$(jq -r '.["VinventureStack-Staging"].CloudFrontUrl // empty' cdk-outputs-staging.json)
          API_URL=$(jq -r '.["VinventureStack-Staging"].ApiGatewayUrl // empty' cdk-outputs-staging.json)
          
          if [ ! -z "$CLOUDFRONT_URL" ]; then
            echo "STAGING_FRONTEND_URL=$CLOUDFRONT_URL" >> $GITHUB_ENV
          fi
          if [ ! -z "$API_URL" ]; then
            echo "STAGING_API_URL=$API_URL" >> $GITHUB_ENV
          fi
        fi

    - name: Upload CDK Outputs
      uses: actions/upload-artifact@v4
      with:
        name: cdk-outputs-staging
        path: ./apps/infrastructure/cdk-outputs-staging.json
        retention-days: 30

    - name: Run Deployment Tests
      run: |
        # Test API health endpoint
        if [ ! -z "$STAGING_API_URL" ]; then
          echo "Testing API health endpoint..."
          curl -f "${STAGING_API_URL}api/health" || echo "Health endpoint not available yet"
        fi

    - name: Notify Deployment Success
      run: |
        echo "✅ Staging deployment completed successfully!"
        echo "Frontend URL: $STAGING_FRONTEND_URL"
        echo "API URL: $STAGING_API_URL"

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./apps/infrastructure
    environment: production
    needs: []

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: CDK Bootstrap
      run: |
        npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}

    - name: CDK Deploy Production
      run: |
        npx cdk deploy VinventureStack-Production \
          --context environment=production \
          --require-approval never \
          --outputs-file cdk-outputs-production.json
      env:
        STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
        STRIPE_LIVE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY }}
        STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}

    - name: Extract CDK Outputs
      run: |
        if [ -f cdk-outputs-production.json ]; then
          echo "## 🎉 Production Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat cdk-outputs-production.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Extract important values
          CLOUDFRONT_URL=$(jq -r '.["VinventureStack-Production"].CloudFrontUrl // empty' cdk-outputs-production.json)
          API_URL=$(jq -r '.["VinventureStack-Production"].ApiGatewayUrl // empty' cdk-outputs-production.json)
          
          if [ ! -z "$CLOUDFRONT_URL" ]; then
            echo "PRODUCTION_FRONTEND_URL=$CLOUDFRONT_URL" >> $GITHUB_ENV
          fi
          if [ ! -z "$API_URL" ]; then
            echo "PRODUCTION_API_URL=$API_URL" >> $GITHUB_ENV
          fi
        fi

    - name: Upload CDK Outputs
      uses: actions/upload-artifact@v4
      with:
        name: cdk-outputs-production
        path: ./apps/infrastructure/cdk-outputs-production.json
        retention-days: 90

    - name: Run Production Health Checks
      run: |
        # Wait for deployment to be ready
        sleep 30
        
        # Test API health endpoint
        if [ ! -z "$PRODUCTION_API_URL" ]; then
          echo "Testing production API health..."
          for i in {1..5}; do
            if curl -f "${PRODUCTION_API_URL}api/health"; then
              echo "✅ Production API is healthy"
              break
            else
              echo "⏳ Waiting for API to be ready... (attempt $i/5)"
              sleep 10
            fi
          done
        fi
        
        # Test frontend
        if [ ! -z "$PRODUCTION_FRONTEND_URL" ]; then
          echo "Testing production frontend..."
          curl -f "$PRODUCTION_FRONTEND_URL" || echo "⚠️ Frontend not immediately available (CloudFront propagation)"
        fi

    - name: Notify Deployment Success
      run: |
        echo "🎉 Production deployment completed successfully!"
        echo "Frontend URL: $PRODUCTION_FRONTEND_URL"
        echo "API URL: $PRODUCTION_API_URL"

  # Manual Destroy (use with extreme caution)
  destroy-infrastructure:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
    defaults:
      run:
        working-directory: ./apps/infrastructure
    environment: 
      name: ${{ github.event.inputs.environment }}
      
    steps:
    - name: ⚠️ Confirm Destruction
      run: |
        echo "🚨 WARNING: This will DESTROY the ${{ github.event.inputs.environment }} infrastructure!"
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "Triggered by: ${{ github.actor }}"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: CDK Destroy
      run: |
        echo "Destroying VinventureStack-${{ github.event.inputs.environment }}..."
        npx cdk destroy VinventureStack-${{ github.event.inputs.environment }} \
          --context environment=${{ github.event.inputs.environment }} \
          --force

    - name: Notify Destruction
      run: |
        echo "💥 Infrastructure destroyed for ${{ github.event.inputs.environment }} environment"